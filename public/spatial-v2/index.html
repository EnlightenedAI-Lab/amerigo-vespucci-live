<!DOCTYPE html>
<html lang="en" data-iqai-surface="spatial-v2">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IQAI Spatial V2 — Command Center</title>
  <script>
    // ArcGIS OAuth app is registered for localhost — not 127.0.0.1 — on port 3000.
    if (location.hostname === '127.0.0.1' && location.port === '3000') {
      location.replace('http://localhost:3000' + location.pathname + location.search);
    }
  </script>
  <link rel="icon" href="/spatial/assets/iqai-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
  <link rel="stylesheet" href="/spatial-v2/iqai-spatial-v2.css" />
</head>
<body class="iqai-v2-body">
  <div id="iqai-spatial-v2" class="iqai-v2-app" data-iqai-shell="command-center" data-iqai-shell-version="shell-v1"></div>
  <script type="module" src="/spatial-v2/spatial-v2.js"></script>
</body>
</html>
