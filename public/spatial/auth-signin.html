<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IQAI ARC GIS AUTH — SIGN IN HERE</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0b1f33;
      color: #fff;
      display: grid;
      place-items: center;
    }
    .card {
      max-width: 720px;
      padding: 48px 56px;
      border: 3px solid #4da3ff;
      border-radius: 16px;
      background: #102a44;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 2rem;
      letter-spacing: 0.04em;
      color: #7ec8ff;
    }
    p { font-size: 1.15rem; line-height: 1.6; margin: 12px 0; }
    .pulse {
      margin-top: 28px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffd166;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>IQAI ARC GIS AUTH</h1>
    <p>This is the correct headed browser window for one-time ArcGIS sign-in.</p>
    <p>Redirecting to ArcGIS Online sign-in in the main window…</p>
    <div class="pulse">SIGN IN HERE</div>
  </div>
  <script>
    document.title = 'IQAI ARC GIS AUTH — SIGN IN HERE';
    setTimeout(() => {
      window.location.replace('/spatial/?auth-setup=1');
    }, 2500);
  </script>
</body>
</html>
